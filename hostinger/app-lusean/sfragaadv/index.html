<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SFRAGA ADVOCACIA — LUSEAN SISTEMAS</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="portal">
      <section class="portal-hero portal-hero-center">
        <p class="portal-eyebrow">Ambiente selecionado</p>
        <h1 class="portal-brand portal-brand-sm">SFRAGA ADVOCACIA</h1>
        <p class="portal-lead">
          Schema <code class="portal-schema-code">sfragaadv</code>
        </p>
        <p class="portal-note">
          Pack estático Hostinger (<strong>app-lusean</strong>) não consulta o
          banco. Para a prévia (contagens em <code>sfragaadv.reclamante</code> e
          <code>public.tbescol</code>), use a app Next com
          <code>LUSEAN_URL</code> em <code>/portal/sfragaadv</code>.
        </p>
        <div class="portal-actions">
          <a class="btn btn-primary" href="../">Voltar aos sistemas</a>
        </div>
      </section>
    </main>
  </body>
</html>
