<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SFRAGA ADVOCACIA — LUSEAN SISTEMAS</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="portal">
      <section class="portal-hero portal-hero-center">
        <p class="portal-eyebrow">Ambiente (referência estática)</p>
        <h1 class="portal-brand portal-brand-sm">SFRAGA ADVOCACIA</h1>
        <p class="portal-lead">
          Schema <code class="portal-schema-code">sfragaadv</code>
        </p>
        <p class="portal-note">
          Pack estático Hostinger (<strong>app-lusean</strong>) não autentica
          nem consulta o banco. Login + prévia (pessoas via
          <code>sfragaadv.pessoa</code>) ficam na app Next em
          <code>/portal</code> com <code>LUSEAN_URL</code>.
        </p>
        <div class="portal-actions">
          <a class="btn btn-primary" href="../">Voltar ao login</a>
        </div>
      </section>
    </main>
  </body>
</html>
